<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ENDE CONTROL">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e8a7d"/>
      <stop offset="1" stop-color="#04211f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.55" y2="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- fundo de vidro turquesa (squircle) -->
  <rect width="512" height="512" rx="113" fill="url(#glass)"/>
  <rect width="512" height="512" rx="113" fill="url(#sheen)"/>
  <rect x="1.75" y="1.75" width="508.5" height="508.5" rx="111.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.13" stroke-width="3.5"/>
  <!-- marca: E de cantos suaves -->
  <g fill="#ffffff">
    <rect x="148.5" y="118" width="215" height="46" rx="9"/>
    <rect x="148.5" y="213" width="184" height="46" rx="9"/>
    <rect x="148.5" y="308" width="215" height="46" rx="9"/>
    <rect x="148.5" y="118" width="46" height="236" rx="9"/>
  </g>
  <rect x="148.5" y="376" width="215" height="18" rx="9" fill="#2dd4bf"/>
</svg>
